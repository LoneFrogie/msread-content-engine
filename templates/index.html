<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MS. READ Content Engine</title>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <!-- Pinned to Babel 7: v8 defaults JSX to the automatic runtime (emits
         `import {jsx} from "react/jsx-runtime"`), which breaks in-browser
         <script type="text/babel"> transpile against the UMD React globals.
         Do NOT drop the version — the unpinned URL now resolves to 8.x. -->
    <script src="https://unpkg.com/@babel/standalone@7.29.7/babel.min.js"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link href="https://fonts.googleapis.com/css2?family=Jost:ital,wght@0,300;0,400;0,500;0,600;1,400&display=swap" rel="stylesheet" />
    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

        :root {
            --brand-black: #151515;
            --brand-coral: #f9765b;
            --brand-coral-light: #fca08c;
            --brand-red: #ee3b45;
            --brand-peach: #f5c3b7;
            --brand-white: #ffffff;
            --brand-offwhite: #f7f7f7;
            --brand-grey: #E2E2E2;
            --brand-dark-grey: #6b6b6b;
            --brand-green: #279A4B;
            --brand-sale: #ab2e1c;
            --error: #ee3b45;
        }

        body {
            font-family: 'Jost', sans-serif;
            background: var(--brand-offwhite);
            color: var(--brand-black);
            min-height: 100vh;
            font-weight: 400;
        }

        .container { max-width: 1100px; margin: 0 auto; padding: 2rem; }

        /* Header */
        .header {
            text-align: center;
            padding: 2.5rem 0 2rem;
            border-bottom: 1px solid var(--brand-grey);
            margin-bottom: 2.5rem;
        }
        .header h1 {
            font-family: 'Jost', sans-serif;
            font-size: 2.6rem;
            font-weight: 500;
            color: var(--brand-black);
            margin-bottom: 0.2rem;
            letter-spacing: 6px;
            text-transform: uppercase;
        }
        .header .tagline {
            color: var(--brand-dark-grey);
            font-size: 0.85rem;
            font-weight: 300;
            letter-spacing: 2px;
            text-transform: uppercase;
        }
        .header .subtitle {
            color: var(--brand-coral);
            font-size: 0.95rem;
            font-weight: 400;
            margin-top: 0.6rem;
        }

        /* Mode Tabs */
        .mode-tabs {
            display: flex;
            gap: 0;
            margin-bottom: 2rem;
            border-bottom: 2px solid var(--brand-grey);
        }
        .mode-tab {
            flex: 1;
            text-align: center;
            padding: 1rem 1.5rem;
            font-family: 'Jost', sans-serif;
            font-size: 0.88rem;
            font-weight: 500;
            color: var(--brand-dark-grey);
            letter-spacing: 1.5px;
            text-transform: uppercase;
            cursor: pointer;
            border: none;
            background: none;
            border-bottom: 2px solid transparent;
            margin-bottom: -2px;
            transition: all 0.2s;
        }
        .mode-tab:hover { color: var(--brand-black); }
        .mode-tab.active {
            color: var(--brand-black);
            border-bottom-color: var(--brand-coral);
        }
        .mode-tab .tab-desc {
            display: block;
            font-size: 0.72rem;
            font-weight: 300;
            color: var(--brand-dark-grey);
            margin-top: 0.2rem;
            letter-spacing: 0.5px;
            text-transform: none;
        }
        /* CONTENT + premium tab */
        .mode-tab-plus.active { border-bottom-color: var(--brand-coral); }
        .mode-tab-plus .plus-glyph {
            color: var(--brand-coral); font-weight: 700; font-size: 1.05em;
        }
        .mode-tab-plus::after {
            content: "NEW"; display: inline-block; vertical-align: super;
            font-size: 0.5rem; letter-spacing: 1px; color: #fff;
            background: var(--brand-coral); padding: 1px 4px; margin-left: 4px;
            border-radius: 2px;
        }

        /* ── CONTENT + : hero ── */
        .cp-hero {
            background: linear-gradient(135deg, #17171a 0%, #2a2320 60%, #3a2620 100%);
            border: none; color: var(--brand-white); position: relative; overflow: hidden;
        }
        .cp-hero::after {
            content: ""; position: absolute; right: -60px; top: -60px; width: 220px; height: 220px;
            background: radial-gradient(circle, rgba(249,118,91,0.35), transparent 70%); pointer-events: none;
        }
        .cp-hero-row { display: flex; justify-content: space-between; align-items: flex-start; gap: 1.5rem; flex-wrap: wrap; }
        .cp-kicker {
            font-family: 'Jost', sans-serif; font-size: 0.72rem; letter-spacing: 3px;
            text-transform: uppercase; color: var(--brand-coral); margin-bottom: 0.5rem;
        }
        .cp-hero-title {
            font-family: 'Jost', sans-serif; font-weight: 500; font-size: 1.7rem;
            line-height: 1.2; margin-bottom: 0.6rem; color: #fff;
        }
        .cp-hero .form-hint { color: rgba(255,255,255,0.72); }

        /* engine badge */
        .cp-engine-badge {
            display: inline-flex; align-items: center; gap: 0.45rem; white-space: nowrap;
            font-size: 0.72rem; letter-spacing: 1px; text-transform: uppercase;
            padding: 0.4rem 0.7rem; border: 1px solid rgba(255,255,255,0.25);
            color: rgba(255,255,255,0.85); border-radius: 2px; background: rgba(0,0,0,0.2);
        }
        .cp-engine-badge .dot { width: 7px; height: 7px; border-radius: 50%; background: #888; }
        .cp-engine-badge.on { border-color: var(--brand-coral); color: #fff; }
        .cp-engine-badge.on .dot { background: var(--brand-coral); box-shadow: 0 0 0 3px rgba(249,118,91,0.25); }

        /* ── Trend Radar grid ── */
        .trend-grid {
            display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
            gap: 0.8rem; margin-top: 1rem;
        }
        .trend-card {
            text-align: left; background: var(--brand-offwhite); border: 1px solid var(--brand-grey);
            padding: 1rem; cursor: pointer; transition: all 0.15s; display: flex; flex-direction: column; gap: 0.35rem;
            font-family: 'Jost', sans-serif;
        }
        .trend-card:hover { border-color: var(--brand-black); transform: translateY(-2px); }
        .trend-card.selected {
            border-color: var(--brand-coral); background: #fff;
            box-shadow: inset 0 0 0 1px var(--brand-coral), 0 6px 18px rgba(249,118,91,0.14);
        }
        .trend-top { display: flex; justify-content: space-between; align-items: center; gap: 0.5rem; }
        .trend-scope {
            font-size: 0.6rem; letter-spacing: 1px; text-transform: uppercase; font-weight: 600;
            padding: 2px 6px; border-radius: 2px;
        }
        .trend-scope.my { background: #eaf5ec; color: var(--brand-green); }
        .trend-scope.global { background: #eef0f6; color: #4256b0; }
        .trend-preset { font-size: 0.62rem; letter-spacing: 0.5px; text-transform: uppercase; color: var(--brand-coral); font-weight: 500; }
        .trend-name { font-size: 1rem; font-weight: 500; color: var(--brand-black); letter-spacing: 0.3px; }
        .trend-moment { font-size: 0.72rem; color: var(--brand-dark-grey); font-weight: 500; }
        .trend-format { font-size: 0.78rem; color: var(--brand-black); }
        .trend-why { font-size: 0.73rem; color: var(--brand-dark-grey); line-height: 1.45; font-style: italic; }
        .cp-custom { margin-top: 1.2rem; }

        /* clip count selector */
        .cp-clips { display: flex; align-items: center; gap: 0.9rem; margin-top: 1.2rem; }
        .clip-choices { display: flex; gap: 0.4rem; }
        .clip-choice {
            width: 38px; height: 38px; border: 1px solid var(--brand-grey); background: var(--brand-offwhite);
            font-family: 'Jost', sans-serif; font-size: 0.95rem; cursor: pointer; transition: all 0.15s; color: var(--brand-black);
        }
        .clip-choice.active { background: var(--brand-black); color: #fff; border-color: var(--brand-black); }
        .cp-generate { margin-top: 1.5rem; }

        /* ── CONTENT + results ── */
        .cp-result-top { display: flex; justify-content: space-between; align-items: flex-start; gap: 1rem; flex-wrap: wrap; }
        .cp-result-head .cp-engine-badge { border-color: var(--brand-coral); color: var(--brand-black); background: #fff; }
        .cp-result-head .cp-engine-badge .dot { background: var(--brand-coral); }
        .cp-hook {
            background: linear-gradient(90deg, rgba(249,118,91,0.10), rgba(249,118,91,0.02));
            border-left: 3px solid var(--brand-coral);
        }
        .cp-hook-label { font-size: 0.68rem; letter-spacing: 2px; text-transform: uppercase; color: var(--brand-coral); margin-bottom: 0.5rem; }
        .cp-hook-text { font-family: 'Jost', sans-serif; font-size: 1.5rem; font-weight: 500; line-height: 1.3; color: var(--brand-black); }
        .cp-shots { display: flex; flex-direction: column; gap: 1rem; }
        .cp-shot { display: flex; gap: 1rem; align-items: stretch; }
        .cp-shot-img { width: 120px; min-width: 120px; aspect-ratio: 9/16; object-fit: cover; cursor: pointer; border: 1px solid var(--brand-grey); background: var(--brand-offwhite); }
        .cp-shot-body { flex: 1; display: flex; flex-direction: column; gap: 0.35rem; }
        .cp-shot-head { display: flex; gap: 0.5rem; align-items: center; }
        .cp-ost { font-size: 0.82rem; color: var(--brand-black); font-weight: 500; }
        .cp-caption { white-space: pre-line; line-height: 1.7; color: var(--brand-black); font-size: 0.95rem; }
        .hashtag-row { display: flex; flex-wrap: wrap; gap: 0.4rem; margin-top: 0.9rem; }
        .hashtag { font-size: 0.75rem; color: #4256b0; background: #eef0f6; padding: 2px 8px; border-radius: 2px; }
        .why-list { margin: 0.3rem 0 0; padding-left: 1.1rem; }
        .why-list li { margin-bottom: 0.5rem; line-height: 1.5; color: var(--brand-black); font-size: 0.9rem; }
        .cp-meta { display: flex; flex-wrap: wrap; gap: 1.2rem; margin-top: 1.2rem; padding-top: 1.2rem; border-top: 1px solid var(--brand-grey); }
        .cp-meta-item { font-size: 0.85rem; color: var(--brand-black); }
        .cp-meta-label { display: block; font-size: 0.62rem; letter-spacing: 1px; text-transform: uppercase; color: var(--brand-dark-grey); margin-bottom: 0.25rem; }
        @media (max-width: 640px) {
            .cp-shot-img { width: 84px; min-width: 84px; }
            .cp-hero-title { font-size: 1.35rem; }
            .cp-hook-text { font-size: 1.2rem; }
        }

        /* Card */
        .card {
            background: var(--brand-white);
            border: 1px solid var(--brand-grey);
            border-radius: 0;
            padding: 2rem;
            margin-bottom: 1.5rem;
        }
        .card h2 {
            font-family: 'Jost', sans-serif;
            font-weight: 500;
            color: var(--brand-black);
            font-size: 1.2rem;
            margin-bottom: 1rem;
            letter-spacing: 1px;
            text-transform: uppercase;
        }

        /* Form */
        .brief-input, .url-input {
            width: 100%;
            background: var(--brand-offwhite);
            border: 1px solid var(--brand-grey);
            border-radius: 0;
            color: var(--brand-black);
            font-family: 'Jost', sans-serif;
            font-size: 0.95rem;
            padding: 1rem;
            resize: vertical;
            line-height: 1.7;
            transition: border-color 0.2s;
        }
        .brief-input { min-height: 160px; }
        .url-input { min-height: auto; resize: none; margin-bottom: 1rem; }
        .brief-input:focus, .url-input:focus {
            outline: none;
            border-color: var(--brand-black);
        }
        .brief-input::placeholder, .url-input::placeholder { color: #999; }

        .form-label {
            display: block;
            font-size: 0.82rem;
            font-weight: 500;
            color: var(--brand-black);
            margin-bottom: 0.5rem;
            letter-spacing: 0.5px;
            text-transform: uppercase;
        }
        .form-hint {
            font-size: 0.78rem;
            color: var(--brand-dark-grey);
            margin-bottom: 0.5rem;
            line-height: 1.5;
        }

        .examples {
            margin-top: 1rem;
            display: flex;
            flex-wrap: wrap;
            gap: 0.5rem;
        }
        .example-chip {
            background: transparent;
            border: 1px solid var(--brand-grey);
            color: var(--brand-dark-grey);
            padding: 0.4rem 0.9rem;
            border-radius: 0;
            font-size: 0.78rem;
            cursor: pointer;
            transition: all 0.2s;
            font-family: 'Jost', sans-serif;
            letter-spacing: 0.3px;
        }
        .example-chip:hover {
            border-color: var(--brand-coral);
            color: var(--brand-coral);
        }

        /* Product Preview */
        .product-preview {
            display: flex;
            gap: 1.5rem;
            padding: 1rem;
            background: var(--brand-offwhite);
            border: 1px solid var(--brand-grey);
            margin-bottom: 1rem;
        }
        .product-preview img {
            width: 100px;
            height: 100px;
            object-fit: cover;
        }
        .product-preview .product-info { flex: 1; }
        .product-preview .product-name {
            font-weight: 500;
            font-size: 1rem;
            margin-bottom: 0.3rem;
        }
        .product-preview .product-price {
            font-size: 1.1rem;
            font-weight: 500;
            color: var(--brand-coral);
        }
        .product-preview .product-price .compare {
            text-decoration: line-through;
            color: var(--brand-dark-grey);
            font-weight: 300;
            font-size: 0.9rem;
            margin-left: 0.5rem;
        }
        .product-preview .product-meta {
            font-size: 0.8rem;
            color: var(--brand-dark-grey);
            margin-top: 0.3rem;
        }

        /* Buttons */
        .btn-primary {
            background: var(--brand-black);
            color: var(--brand-white);
            border: none;
            padding: 0.9rem 2.8rem;
            border-radius: 0;
            font-family: 'Jost', sans-serif;
            font-size: 0.9rem;
            font-weight: 500;
            cursor: pointer;
            margin-top: 1.5rem;
            transition: all 0.2s;
            letter-spacing: 1.5px;
            text-transform: uppercase;
        }
        .btn-primary:hover { background: #333; }
        .btn-primary:disabled { opacity: 0.4; cursor: not-allowed; }

        .btn-secondary {
            background: transparent;
            color: var(--brand-black);
            border: 1px solid var(--brand-black);
            padding: 0.7rem 2rem;
            border-radius: 0;
            font-family: 'Jost', sans-serif;
            font-size: 0.85rem;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s;
            letter-spacing: 1px;
            text-transform: uppercase;
        }
        .btn-secondary:hover { background: var(--brand-black); color: var(--brand-white); }

        .btn-download {
            background: var(--brand-coral);
            color: var(--brand-white);
            border: none;
            padding: 1rem 2.5rem;
            border-radius: 0;
            font-family: 'Jost', sans-serif;
            font-size: 0.95rem;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s;
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            letter-spacing: 1px;
            text-transform: uppercase;
        }
        .btn-download:hover { background: #e5654b; transform: translateY(-1px); box-shadow: 0 4px 16px rgba(249,118,91,0.3); }

        /* Progress */
        .progress-bar-container {
            background: var(--brand-grey);
            border-radius: 0;
            height: 6px;
            overflow: hidden;
            margin: 1rem 0;
        }
        .progress-bar-fill {
            height: 100%;
            background: linear-gradient(90deg, var(--brand-coral), var(--brand-coral-light));
            transition: width 0.5s ease;
        }

        .phase-indicator {
            display: flex;
            gap: 0;
            margin-bottom: 2rem;
        }
        .phase-step {
            flex: 1;
            text-align: center;
            padding: 0.8rem 0.5rem;
            font-size: 0.72rem;
            color: var(--brand-dark-grey);
            border-bottom: 2px solid var(--brand-grey);
            transition: all 0.3s;
            letter-spacing: 0.5px;
            text-transform: uppercase;
        }
        .phase-step.active {
            color: var(--brand-coral);
            border-bottom-color: var(--brand-coral);
            font-weight: 500;
        }
        .phase-step.done {
            color: var(--brand-green);
            border-bottom-color: var(--brand-green);
        }

        /* Image Grid */
        .image-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
            gap: 0.8rem;
            margin-top: 1rem;
        }
        .image-slot {
            aspect-ratio: 1;
            background: var(--brand-offwhite);
            border: 1px solid var(--brand-grey);
            border-radius: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            position: relative;
            transition: border-color 0.3s;
        }
        .image-slot.generating {
            border-color: var(--brand-coral);
            animation: pulse-border 1.5s infinite;
        }
        .image-slot.done { border-color: var(--brand-green); }
        .image-slot.failed { border-color: var(--error); }
        .image-slot img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            animation: fadeIn 0.5s ease;
        }
        .image-slot .label {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            background: linear-gradient(transparent, rgba(21,21,21,0.85));
            padding: 2rem 0.6rem 0.5rem;
            font-size: 0.7rem;
            color: var(--brand-white);
        }
        .image-slot .day-badge {
            font-size: 0.68rem;
            color: var(--brand-peach);
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        @keyframes pulse-border {
            0%, 100% { border-color: var(--brand-coral); }
            50% { border-color: var(--brand-grey); }
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: scale(0.97); }
            to { opacity: 1; transform: scale(1); }
        }

        /* Spinner */
        .spinner {
            width: 24px; height: 24px;
            border: 2px solid var(--brand-grey);
            border-top-color: var(--brand-coral);
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }
        @keyframes spin { to { transform: rotate(360deg); } }

        /* Log */
        .log-panel {
            background: var(--brand-offwhite);
            border: 1px solid var(--brand-grey);
            border-radius: 0;
            padding: 1rem;
            max-height: 200px;
            overflow-y: auto;
            font-family: 'Jost', sans-serif;
            font-size: 0.8rem;
            color: var(--brand-dark-grey);
            margin-top: 1rem;
        }
        .log-entry { padding: 0.15rem 0; }
        .log-entry.success { color: var(--brand-green); }
        .log-entry.error { color: var(--error); }
        .log-entry .time { color: #aaa; margin-right: 0.5rem; }

        /* Results */
        .results-summary {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
            gap: 0.8rem;
            margin: 1.5rem 0;
        }
        .stat-card {
            background: var(--brand-offwhite);
            border: 1px solid var(--brand-grey);
            border-radius: 0;
            padding: 1.2rem;
            text-align: center;
        }
        .stat-card .value {
            font-family: 'Jost', sans-serif;
            font-size: 2rem;
            font-weight: 500;
            color: var(--brand-black);
        }
        .stat-card .label {
            font-size: 0.72rem;
            color: var(--brand-dark-grey);
            margin-top: 0.2rem;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .download-section {
            text-align: center;
            padding: 2rem 0;
            display: flex;
            gap: 1rem;
            justify-content: center;
            flex-wrap: wrap;
        }

        /* Announcement bar */
        .announcement-bar {
            background: var(--brand-peach);
            text-align: center;
            padding: 0.6rem;
            font-size: 0.78rem;
            color: var(--brand-black);
            letter-spacing: 1px;
            font-weight: 400;
        }

        /* Lightbox */
        .lightbox {
            position: fixed;
            inset: 0;
            background: rgba(21,21,21,0.92);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 1000;
            cursor: pointer;
        }
        .lightbox img {
            max-width: 90vw;
            max-height: 90vh;
        }

        /* Footer */
        .footer {
            text-align: center;
            padding: 2rem 0 1rem;
            color: var(--brand-dark-grey);
            font-size: 0.75rem;
            border-top: 1px solid var(--brand-grey);
            margin-top: 2rem;
            letter-spacing: 0.5px;
        }
        .footer a { color: var(--brand-coral); text-decoration: none; }
        .footer a:hover { text-decoration: underline; }

        /* Avatar Selection */
        .avatar-section { margin-top: 1.5rem; }
        .avatar-grid {
            display: flex;
            gap: 1rem;
            margin-top: 0.8rem;
        }
        .avatar-slot {
            flex: 1;
            border: 2px solid var(--brand-grey);
            background: var(--brand-offwhite);
            position: relative;
            text-align: center;
            transition: all 0.2s;
            min-height: 200px;
            display: flex;
            flex-direction: column;
        }
        .avatar-slot.selected { border-color: var(--brand-coral); }
        .avatar-slot .avatar-preview {
            width: 100%;
            aspect-ratio: 3/4;
            object-fit: cover;
            display: block;
        }
        .avatar-slot .avatar-placeholder {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            color: var(--brand-dark-grey);
            font-size: 0.82rem;
            padding: 1rem;
            cursor: pointer;
        }
        .avatar-slot .avatar-placeholder .upload-icon {
            font-size: 2rem;
            margin-bottom: 0.5rem;
            color: var(--brand-grey);
        }
        .avatar-slot .avatar-controls {
            display: flex;
            border-top: 1px solid var(--brand-grey);
        }
        .avatar-slot .avatar-controls button {
            flex: 1;
            padding: 0.5rem;
            border: none;
            background: none;
            font-family: 'Jost', sans-serif;
            font-size: 0.72rem;
            cursor: pointer;

<script type="text/babel">
const { useState, useEffect, useRef } = React;

// ── Avatar helpers ──
const AVATAR_STORAGE_KEY = "msread_avatars";
const MAX_AVATAR_PX = 600; // resize uploaded images to this max dimension

function loadAvatarsFromStorage() {
    try {
        const stored = localStorage.getItem(AVATAR_STORAGE_KEY);
        if (stored) return JSON.parse(stored);
    } catch (e) {}
    return [null, null, null]; // 3 slots
}

function saveAvatarsToStorage(avatars) {
    try {
        localStorage.setItem(AVATAR_STORAGE_KEY, JSON.stringify(avatars));
    } catch (e) {
        console.warn("localStorage full, avatar not saved");
    }
}

function resizeImageToBase64(file, maxPx) {
    return new Promise((resolve) => {
        const reader = new FileReader();
        reader.onload = (e) => {
            const img = new Image();
            img.onload = () => {
                const canvas = document.createElement("canvas");
                let w = img.width, h = img.height;
                if (Math.max(w, h) > maxPx) {
                    const ratio = maxPx / Math.max(w, h);
                    w = Math.round(w * ratio);
                    h = Math.round(h * ratio);
                }
                canvas.width = w;
                canvas.height = h;
                canvas.getContext("2d").drawImage(img, 0, 0, w, h);
                resolve(canvas.toDataURL("image/png"));
            };
            img.src = e.target.result;
        };
        reader.readAsDataURL(file);
    });
}

const EXAMPLE_BRIEFS = [

];

];

const CONTENT_PLUS_PHASES = [
    { key: "fetching_product", label: "Product" },
    { key: "strategy", label: "Strategy" },
    { key: "generating_images", label: "Shots" },
    { key: "generating_videos", label: "Motion" },
    { key: "packaging", label: "Package" },
    { key: "done", label: "Done" },
];

// Default planning brief (the art director's brief — editable in the UI).
const DEFAULT_IDEA_BRIEF = "Content ideas must be a mixture of J.Crew, Net-a-Porter, H&M, and local brands such as Hanya, Mis Claire, Machino, Hani Mokhta. Theme direction should be everyday, lifestyle-led pieces like \"Running Late Go-To Outfit\", \"Weekend Getaway Pieces\", \"1 Blouse, 3 Ways\" — soft-selling that builds the brand the way H&M and the local brands do.";
const DEFAULT_IDEA_BRANDS = "J.Crew, Net-a-Porter, H&M, Hanya, Mis Claire, Machino, Hani Mokhta";
const NEXT_MONTH_NAME = new Date(new Date().getFullYear(), new Date().getMonth() + 1, 1)
    .toLocaleString("en-US", { month: "long" });

function App() {
    const [mode, setMode] = useState("calendar"); // "calendar" | "sku" | "pdp"
    const [view, setView] = useState("input");
    const [brief, setBrief] = useState("");
    const [productUrl, setProductUrl] = useState("");
    const [productPreview, setProductPreview] = useState(null);

    // Avatar state: array of 3 slots, each null or base64 string
    const [avatars, setAvatars] = useState(loadAvatarsFromStorage);
    const [selectedAvatars, setSelectedAvatars] = useState(() => {
        // Auto-select any pre-loaded avatars
        const stored = loadAvatarsFromStorage();
        const sel = new Set();
        stored.forEach((a, i) => { if (a) sel.add(i); });
        return sel;
    });
    const avatarFileRefs = [useRef(null), useRef(null), useRef(null)];
    const [sessionId, setSessionId] = useState(null);
    const [activeMode, setActiveMode] = useState("calendar");
    const [events, setEvents] = useState([]);
    const [images, setImages] = useState({});
    const [currentPhase, setCurrentPhase] = useState("");
    const [imageProgress, setImageProgress] = useState({ current: 0, total: 13 });
    const [error, setError] = useState(null);
    const [lightbox, setLightbox] = useState(null);
    const [startTime, setStartTime] = useState(null);
    const [endTime, setEndTime] = useState(null);
    const [pdpContent, setPdpContent] = useState(null);
    const [copyState, setCopyState] = useState({});
    const [videos, setVideos] = useState([]);
    // Idea / Theme Planner state
    const [ideaBrief, setIdeaBrief] = useState(DEFAULT_IDEA_BRIEF);
    const [ideaBrands, setIdeaBrands] = useState(DEFAULT_IDEA_BRANDS);
    const [ideaMonth, setIdeaMonth] = useState(NEXT_MONTH_NAME);
    const [ideasContent, setIdeasContent] = useState(null);
    // CONTENT + (Trend-to-Reel viral studio)
    const [cpTrends, setCpTrends] = useState([]);
    const [cpPresets, setCpPresets] = useState([]);
    const [cpHiggsfield, setCpHiggsfield] = useState(false);
    const [cpTrendId, setCpTrendId] = useState("");
    const [cpCustomTopic, setCpCustomTopic] = useState("");
    const [cpNumClips, setCpNumClips] = useState(3);
    const [cpContent, setCpContent] = useState(null);
    const logRef = useRef(null);

    useEffect(() => {
        if (logRef.current) logRef.current.scrollTop = logRef.current.scrollHeight;
    }, [events]);

    // Load the CONTENT + Trend Radar once
    useEffect(() => {
        fetch("/api/content-plus/trends")
            .then(r => r.json())
            .then(d => {
                setCpTrends(d.trends || []);
                setCpPresets(d.presets || []);
                setCpHiggsfield(!!d.higgsfield_enabled);
                if (!cpTrendId && (d.trends || []).length) setCpTrendId(d.trends[0].id);
            })
            .catch(() => {});
    }, []);

    // ── Calendar Generation ──
    async function handleGenerateCalendar() {
        if (!brief.trim()) return;
        _resetProgress("calendar");

        try {
            const res = await fetch("/api/generate", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ creative_brief: brief }),
            });
            if (!res.ok) { setError((await res.json()).detail || "Failed"); return; }

            const { session_id } = await res.json();
            setSessionId(session_id);
            setActiveMode("calendar");
            setView("progress");
            _listenToProgress(session_id);
        } catch (err) { setError("Network error: " + err.message); }
    }

    // ── SKU Generation ──
    async function handleGenerateSku() {
        if (!productUrl.trim()) return;
        _resetProgress("sku");

        // Collect selected avatar base64 data
        const avatarData = [];
        selectedAvatars.forEach(idx => {
            if (avatars[idx]) avatarData.push(avatars[idx]);
        });

        try {
            const res = await fetch("/api/generate-sku", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({
                    product_url: productUrl,
                    creative_brief: brief,
                    avatar_images: avatarData,
                }),
            });
            if (!res.ok) { setError((await res.json()).detail || "Failed"); return; }

            const { session_id } = await res.json();
            setSessionId(session_id);
            setActiveMode("sku");
            setView("progress");
            _listenToProgress(session_id);
        } catch (err) { setError("Network error: " + err.message); }
    }

    // ── PDP Generation ──
    async function handleGeneratePdp() {
        if (!productUrl.trim()) return;
        _resetProgress("pdp");
        setPdpContent(null);

        try {
            const res = await fetch("/api/generate-pdp", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({
                    product_url: productUrl,
                    creative_brief: brief,
                }),
            });
            if (!res.ok) { setError((await res.json()).detail || "Failed"); return; }

            const { session_id } = await res.json();
            setSessionId(session_id);
            setActiveMode("pdp");
            setView("progress");

            // Listen to progress, then fetch PDP content when done
            const es = new EventSource(`/api/progress/${session_id}`);
            es.onmessage = (e) => {
                const ev = JSON.parse(e.data);
                if (ev.type === "stream_end") {
                    es.close();
                    if (ev.status === "done") {
                        setEndTime(Date.now());
                        // Fetch PDP content JSON
                        fetch(`/api/pdp-content/${session_id}`)
                            .then(r => r.json())
                            .then(data => {
                                setPdpContent(data);
                                setView("results");
                            })
                            .catch(() => setView("results"));
                    } else {
                        setError("Generation failed. Check the log.");
                    }
                    return;
                }
                setEvents((prev) => [...prev, ev]);
                if (ev.type === "status" && ev.phase) {
                    setCurrentPhase(ev.phase);
                    if (ev.product) setProductPreview(ev.product);
                    // Capture PDP content from the done event
                    if (ev.pdp_content) setPdpContent({ description: ev.pdp_content, product: ev.product || productPreview });
                }
                if (ev.type === "error") setError(ev.message);
            };
            es.onerror = () => es.close();
        } catch (err) { setError("Network error: " + err.message); }
    }

    // ── Idea / Theme Planner Generation ──
    async function handleGenerateIdeas() {
        _resetProgress("ideas");
        setIdeasContent(null);

        try {
            const res = await fetch("/api/generate-ideas", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({
                    theme_direction: ideaBrief,
                    brands: ideaBrands,
                    month: ideaMonth,
                    num_days: 30,
                }),
            });
            if (!res.ok) { setError((await res.json()).detail || "Failed"); return; }

            const { session_id } = await res.json();
            setSessionId(session_id);
            setActiveMode("ideas");
            setView("progress");

            const es = new EventSource(`/api/progress/${session_id}`);
            es.onmessage = (e) => {
                const ev = JSON.parse(e.data);
                if (ev.type === "stream_end") {
                    es.close();
                    if (ev.status === "done") {
                        setEndTime(Date.now());
                        fetch(`/api/ideas-content/${session_id}`)
                            .then(r => r.json())
                            .then(data => { setIdeasContent(data); setView("results"); })
                            .catch(() => setView("results"));
                    } else {
                        setError("Generation failed. Check the log.");
                    }
                    return;
                }
                setEvents((prev) => [...prev, ev]);
                if (ev.type === "status" && ev.phase) {
                    setCurrentPhase(ev.phase);
                    if (ev.ideas_content) setIdeasContent(ev.ideas_content);
                }
                if (ev.type === "error") setError(ev.message);
            };
            es.onerror = () => es.close();
        } catch (err) { setError("Network error: " + err.message); }
    }

    // ── CONTENT + Generation (Trend-to-Reel) ──
    async function handleGenerateContentPlus() {
        if (!productUrl.trim()) { setError("Paste a product link from msreadshop.com"); return; }
        if (!cpTrendId && !cpCustomTopic.trim()) { setError("Pick a trend or type a custom topic"); return; }
        _resetProgress("content_plus");
        setCpContent(null);

        try {
            const res = await fetch("/api/generate-content-plus", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({
                    product_url: productUrl,
                    trend_id: cpTrendId,
                    custom_topic: cpCustomTopic,
                    creative_brief: brief,
                    num_clips: cpNumClips,
                }),
            });
            if (!res.ok) { setError((await res.json()).detail || "Failed"); return; }

            const { session_id } = await res.json();
            setSessionId(session_id);
            setActiveMode("content_plus");
            setView("progress");

            const es = new EventSource(`/api/progress/${session_id}`);
            es.onmessage = (e) => {
                const ev = JSON.parse(e.data);
                if (ev.type === "stream_end") {
                    es.close();
                    if (ev.status === "done") {
                        setEndTime(Date.now());
                        fetch(`/api/content-plus/${session_id}`)
                            .then(r => r.json())
                            .then(data => { setCpContent(data); setView("results"); })
                            .catch(() => setView("results"));
                    } else {
                        setError("Generation failed. Check the log.");
                    }
                    return;
                }
                setEvents((prev) => [...prev, ev]);
                if (ev.type === "status" && ev.phase) {
                    setCurrentPhase(ev.phase);
                    if (ev.product) setProductPreview(ev.product);
                    if (ev.brief) setCpContent((prev) => ({ ...(prev || {}), brief: ev.brief }));
                }
                if (ev.type === "image_start") {
                    setImageProgress({ current: ev.index, total: ev.total });
                    setImages((prev) => ({ ...prev, [ev.day]: { status: "generating", theme: ev.theme } }));
                }
                if (ev.type === "image_done" && ev.success && ev.filename) {
                    setImages((prev) => ({ ...prev, [ev.day]: { status: "done", theme: ev.theme, filename: ev.filename } }));
                }
                if (ev.type === "error") setError(ev.message);
            };
            es.onerror = () => es.close();
        } catch (err) { setError("Network error: " + err.message); }
    }

    function _resetProgress(m) {
        setError(null);
        setEvents([]);
        setImages({});
        setVideos([]);
        setCurrentPhase(m === "ideas" ? "generating_ideas" : (m === "pdp" || m === "sku" || m === "content_plus") ? "fetching_product" : "adapting");
        setImageProgress({ current: 0, total: m === "content_plus" ? cpNumClips : m === "sku" ? 4 : 30 });
        setStartTime(Date.now());
        setEndTime(null);
        setProductPreview(null);
    }

    function _listenToProgress(session_id) {
        const es = new EventSource(`/api/progress/${session_id}`);
        es.onmessage = (e) => {
            const ev = JSON.parse(e.data);
            if (ev.type === "stream_end") {
                es.close();
                if (ev.status === "done") {
                    setEndTime(Date.now());
                    // Fetch video list
                    fetch(`/api/videos/${session_id}`)
                        .then(r => r.json())
                        .then(data => setVideos(data.videos || []))
                        .catch(() => {});
                    setView("results");
                }
                else setError("Generation failed. Check the log.");
                return;
            }
            setEvents((prev) => [...prev, ev]);
            if (ev.type === "status" && ev.phase) {
                setCurrentPhase(ev.phase);
                // Capture product preview from the fetch phase
                if (ev.product) setProductPreview(ev.product);
            }
            if (ev.type === "image_start") {
                setImageProgress({ current: ev.index, total: ev.total });
                setImages((prev) => ({ ...prev, [ev.day]: { status: "generating", theme: ev.theme } }));
            }
            if (ev.type === "image_done") {
                setImageProgress({ current: ev.index + 1, total: ev.total });
                setImages((prev) => ({ ...prev, [ev.day]: { status: ev.success ? "done" : "failed", theme: ev.theme, filename: ev.filename } }));
            }
            if (ev.type === "error") setError(ev.message);
        };
        es.onerror = () => es.close();
    }

    // ── Avatar handlers ──
    async function handleAvatarUpload(slotIndex, e) {
        const file = e.target.files[0];
        if (!file) return;
        const b64 = await resizeImageToBase64(file, MAX_AVATAR_PX);
        const updated = [...avatars];
        updated[slotIndex] = b64;
        setAvatars(updated);
        saveAvatarsToStorage(updated);
        // Auto-select on upload
        setSelectedAvatars(prev => { const s = new Set(prev); s.add(slotIndex); return s; });
    }

    function handleAvatarRemove(slotIndex) {
        const updated = [...avatars];
        updated[slotIndex] = null;
        setAvatars(updated);
        saveAvatarsToStorage(updated);
        setSelectedAvatars(prev => { const s = new Set(prev); s.delete(slotIndex); return s; });
    }

    function toggleAvatarSelect(slotIndex) {
        if (!avatars[slotIndex]) return; // can't select empty slot
        setSelectedAvatars(prev => {
            const s = new Set(prev);
            if (s.has(slotIndex)) {
                if (s.size > 1) s.delete(slotIndex); // min 1
            } else {
                s.add(slotIndex);
            }
            return s;
        });
    }

    function copyToClipboard(key, text) {
        navigator.clipboard.writeText(text).then(() => {
            setCopyState(prev => ({ ...prev, [key]: true }));
            setTimeout(() => setCopyState(prev => ({ ...prev, [key]: false })), 2000);
        });
    }

        lines.push("Quick Specs & Fit");

            lines.push(`• SKU: ${d.quick_specs.sku || ""}`);
            lines.push(`• Fabric: ${d.quick_specs.fabric || ""}`);
            lines.push(`• Fit Type: ${d.quick_specs.fit_type || ""}`);
            lines.push(`• Key Features: ${d.quick_specs.key_features || ""}`);
            lines.push(`• Care: ${d.quick_specs.care || ""}`);
        }
        lines.push("", "The Style Story", d.style_story || "");
        lines.push("", "Why You'll Love It");
        (d.why_youll_love_it || []).forEach(b => {
            lines.push(`• ${b.title}: ${b.description}`);

        lines.push("", "How To Style");
        (d.how_to_style || []).forEach(s => {
            lines.push(`• ${s.look_name}: ${s.description}`);

        lines.push("", "Sizing Recommendation", d.sizing_recommendation || "");

    function copyFullIdeas() {

                            <h2>Image Generation ({imagesDone}/{imageProgress.total})</h2>
                            <div className="image-grid">
                                {Object.entries(images).sort(([a],[b]) => Number(a)-Number(b)).map(([day, img]) => (
                                    <div key={day} className={`image-slot ${img.status}`}>
                                        {img.status === "generating" && <div className="spinner" />}
                                        {img.status === "done" && img.filename && (
                                            <img src={`/api/images/${sessionId}/${img.filename}`} alt={img.theme}
                                                onClick={() => setLightbox(`/api/images/${sessionId}/${img.filename}`)}
                                                style={{ cursor: "pointer" }} />
                                        )}
                                        {img.status === "failed" && <span style={{ color: "var(--error)", fontSize: "0.75rem" }}>Failed</span>}
                                        <div className="label">
                                            <span className="day-badge">{activeMode === "sku" ? `Image ${day}` : `Day ${day}`}</span>
                                            <br />{img.theme}
                                        </div>
                                    </div>
                                ))}
                            </div>
                        </div>
                    )}

                    <div className="card">
                        <h2>Activity Log</h2>
                        <div className="log-panel" ref={logRef}>
                            {events.map((e, i) => (
                                <div key={i} className={`log-entry ${e.type === "error" ? "error" : e.success === true ? "success" : ""}`}>
                                    <span className="time">{new Date(e.timestamp).toLocaleTimeString()}</span>
                                    {e.message}
                                </div>
                            ))}
                        </div>
                    </div>
                </>
            )}

            {/* ── RESULTS VIEW ── */}
            {view === "results" && activeMode === "pdp" && pdpContent && (
                <>
                    {/* PDP Results */}
                    <div className="card">
                        <div className="pdp-product-header">
                            {(pdpContent.product?.image_url || productPreview?.image_url) && (
                                <img src={pdpContent.product?.image_url || productPreview?.image_url}
                                    alt={pdpContent.product?.title || productPreview?.title} />
                            )}
                            <div className="product-info">
                                <div className="product-title">{pdpContent.product?.title || productPreview?.title}</div>
                                <div className="product-price">RM{pdpContent.product?.price || productPreview?.price}</div>
                                {pdpContent.description?.seo_title && (
                                    <p style={{ fontSize: "0.8rem", color: "var(--brand-dark-grey)", marginTop: "0.5rem" }}>
                                        <strong>SEO Title:</strong> {pdpContent.description.seo_title}
                                    </p>
                                )}
                                {pdpContent.description?.meta_description && (
                                    <p style={{ fontSize: "0.8rem", color: "var(--brand-dark-grey)", marginTop: "0.2rem" }}>
                                        <strong>Meta:</strong> {pdpContent.description.meta_description}
                                    </p>
                                )}
                                <div className="pdp-actions">
                                    <button className={`btn-copy ${copyState.full_pdp ? "copied" : ""}`} onClick={copyFullPdp}>
                                        {copyState.full_pdp ? "Copied!" : "Copy Full Description"}
                                    </button>
                                    <button className={`btn-copy ${copyState.story ? "copied" : ""}`}
                                        onClick={() => copyToClipboard("story", pdpContent.description?.style_story || "")}>
                                        {copyState.story ? "Copied!" : "Copy Style Story"}
                                    </button>
                                    <button className={`btn-copy ${copyState.sizing ? "copied" : ""}`}
                                        onClick={() => copyToClipboard("sizing", pdpContent.description?.sizing_recommendation || "")}>
                                        {copyState.sizing ? "Copied!" : "Copy Sizing"}
                                    </button>
                                </div>
                            </div>
                        </div>
                    </div>

                    {pdpContent.description && (() => {
                        const d = pdpContent.description;
                        return (
                            <div className="card pdp-preview">
                                {/* Quick Specs & Fit */}
                                {d.quick_specs && (
                                    <div className="pdp-section">
                                        <h3>Quick Specs &amp; Fit</h3>
                                        <div className="pdp-specs">
                                            <span className="spec-label">SKU:</span>
                                            <span className="spec-value">{d.quick_specs.sku}</span>
                                            <span className="spec-label">Fabric:</span>
                                            <span className="spec-value">{d.quick_specs.fabric}</span>
                                            <span className="spec-label">Fit Type:</span>
                                            <span className="spec-value">{d.quick_specs.fit_type}</span>
                                            <span className="spec-label">Key Features:</span>
                                            <span className="spec-value">{d.quick_specs.key_features}</span>
                                            <span className="spec-label">Care:</span>
                                            <span className="spec-value">{d.quick_specs.care}</span>
                                        </div>
                                    </div>
                                )}

                                {/* The Style Story */}
                                {d.style_story && (
                                    <div className="pdp-section">
                                        <h3>The Style Story</h3>
                                        <p className="pdp-story">{d.style_story}</p>
                                    </div>
                                )}

                                {/* Why You'll Love It */}
                                {d.why_youll_love_it && (
                                    <div className="pdp-section">
                                        <h3>Why You'll Love It</h3>
                                        <div className="pdp-benefits">
                                            {d.why_youll_love_it.map((b, i) => (
                                                <div key={i} className="benefit-item">
                                                    <div className="benefit-title">{b.title}</div>
                                                    <div className="benefit-desc">{b.description}</div>
                                                </div>
                                            ))}
                                        </div>
                                    </div>
                                )}

                                {/* How To Style */}
                                {d.how_to_style && (
                                    <div className="pdp-section">
                                        <h3>How To Style</h3>
                                        <div className="pdp-styling">
                                            {d.how_to_style.map((s, i) => (
                                                <div key={i} className="style-item">
                                                    <span className="style-name">{s.look_name}: </span>
                                                    <span className="style-desc">{s.description}</span>
                                                </div>
                                            ))}
                                        </div>
                                    </div>
                                )}

                                {/* Sizing Recommendation */}
                                {d.sizing_recommendation && (
                                    <div className="pdp-section">
                                        <h3>Sizing Recommendation</h3>
                                        <div className="pdp-sizing">{d.sizing_recommendation}</div>
                                    </div>
                                )}
                            </div>
                        );
                    })()}

                    {duration && (
                        <div className="card" style={{ textAlign: "center" }}>
                            <p style={{ color: "var(--brand-dark-grey)", fontSize: "0.85rem" }}>
                                Generated in {Math.floor(duration/60)}:{String(duration%60).padStart(2,'0')}
                            </p>
                        </div>
                    )}

                    <div style={{ textAlign: "center", marginTop: "1rem" }}>
                        <button className="btn-secondary" onClick={resetToInput}>Optimize Another Product</button>
                    </div>
                </>
            )}

            {/* ── IDEAS / THEME PLANNER RESULTS ── */}
            {view === "results" && activeMode === "ideas" && ideasContent && (
                <>
                    <div className="card">
                        <div style={{ display: "flex", justifyContent: "space-between", alignItems: "flex-start", gap: "1rem", flexWrap: "wrap" }}>
                            <div>
                                <div className="product-title" style={{ fontSize: "1.3rem" }}>
                                    {ideasContent.month ? `${ideasContent.month} — ` : ""}{ideasContent.theme_name || "Content Theme Calendar"}
                                </div>
                                {ideasContent.content_mix && (
                                    <p style={{ fontSize: "0.85rem", color: "var(--brand-dark-grey)", marginTop: "0.3rem" }}>{ideasContent.content_mix}</p>
                                )}
                            </div>
                            <div className="pdp-actions">
                                <button className={`btn-copy ${copyState.full_ideas ? "copied" : ""}`} onClick={copyFullIdeas}>
                                    {copyState.full_ideas ? "Copied!" : "Copy All"}
                                </button>
                                <a className="btn-copy" href={`/api/download-excel/${sessionId}`}>Download Excel</a>
                            </div>
                        </div>
                    </div>

                    {(ideasContent.weeks || []).map((wk, wi) => (
                        <div className="card pdp-preview" key={wi}>
                            <div className="pdp-section">
                                <h3>{wk.week_label || `Week ${wi + 1}`}</h3>
                                <div className="pdp-styling">
                                    {(wk.days || []).map((d, di) => (
                                        <div key={di} className="style-item" style={{ display: "flex", gap: "0.6rem", alignItems: "baseline" }}>
                                            <span className="day-badge" style={{ minWidth: "48px" }}>Day {d.day}</span>
                                            <span style={{ flex: 1 }}>
                                                <span className="style-name">{d.title}</span>
                                                {d.format && <span style={{ fontSize: "0.7rem", color: "var(--brand-coral)", marginLeft: "0.4rem", textTransform: "uppercase", letterSpacing: "0.5px" }}>{d.format}</span>}
                                                <br /><span className="style-desc">{d.subtitle}</span>
                                                {d.hook && <><br /><span style={{ fontSize: "0.8rem", color: "var(--brand-dark-grey)", fontStyle: "italic" }}>&ldquo;{d.hook}&rdquo;</span></>}
                                            </span>
                                        </div>
                                    ))}
                                </div>
                            </div>
                        </div>
                    ))}

                    {(ideasContent.bonus_themes || []).length > 0 && (
                        <div className="card pdp-preview">
                            <div className="pdp-section">
                                <h3>Bonus / Swap-in Themes</h3>
                                {ideasContent.bonus_themes.map((grp, gi) => (
                                    <div key={gi} style={{ marginBottom: "0.8rem" }}>
                                        <div className="benefit-title">{grp.category}</div>
                                        <div className="style-desc">{(grp.items || []).join(" · ")}</div>
                                    </div>
                                ))}
                            </div>
                        </div>
                    )}

                    {duration && (
                        <div className="card" style={{ textAlign: "center" }}>
                            <p style={{ color: "var(--brand-dark-grey)", fontSize: "0.85rem" }}>
                                Generated in {Math.floor(duration/60)}:{String(duration%60).padStart(2,'0')}
                            </p>
                        </div>
                    )}

                    <div style={{ textAlign: "center", marginTop: "1rem" }}>
                        <button className="btn-secondary" onClick={resetToInput}>Plan Another Month</button>
                    </div>
                </>
            )}

            {view === "results" && activeMode === "content_plus" && cpContent && (() => {
                const b = cpContent.brief || {};
                const imgs = cpContent.images || [];
                const vids = cpContent.videos || [];
                const tags = (b.hashtags || []).map(h => "#" + String(h).replace(/^#/, ""));
                const presetLabel = (id) => (cpPresets.find(p => p.id === id) || {}).label || id;
                return (
                <>
                    <div className="card cp-result-head">
                        <div className="cp-result-top">
                            <div>
                                <div className="cp-kicker">{(cpContent.trend || {}).name || "Custom trend"}</div>
                                <div className="product-title" style={{ fontSize: "1.5rem" }}>{b.concept_name || "Viral Concept"}</div>
                                <p className="style-desc" style={{ marginTop: "0.4rem" }}>{b.big_idea}</p>
                            </div>
                            <div className="cp-engine-badge on"><span className="dot"></span>{cpContent.engine === "higgsfield" ? "Higgsfield" : "Veo 3.1"}</div>
                        </div>
                        <div className="pdp-actions" style={{ marginTop: "1.2rem" }}>
                            <button className={`btn-copy ${copyState.cp_caption ? "copied" : ""}`}
                                onClick={() => copyToClipboard("cp_caption", (b.caption || "") + "\n\n" + tags.join(" "))}>
                                {copyState.cp_caption ? "Copied!" : "Copy Caption + Tags"}
                            </button>
                            <button className="btn-download" onClick={() => window.location.href = `/api/download/${sessionId}`}>
                                Download Pack (.zip)
                            </button>
                        </div>
                    </div>

                    {b.hook_line && (
                        <div className="card cp-hook">
                            <div className="cp-hook-label">The Hook &mdash; first 2 seconds</div>
                            <div className="cp-hook-text">&ldquo;{b.hook_line}&rdquo;</div>
                        </div>
                    )}

                    {vids.length > 0 && (
                        <div className="card">
                            <h2>Viral Motion Clips</h2>
                            <p className="form-hint">9:16 vertical, ready for Reels / TikTok / Stories.</p>
                            <div className="video-grid">
                                {vids.map((v, i) => (
                                    <div key={i} className="video-slot">
                                        <video src={`/api/video/${sessionId}/${v.filename}`} controls preload="metadata" playsInline />
                                        <div className="video-info">
                                            <span className="video-scene">{presetLabel(v.preset)}</span>
                                            <span className="video-size">{v.size_mb} MB</span>
                                        </div>
                                        <a href={`/api/video/${sessionId}/${v.filename}`} download={v.filename} className="btn-copy"
                                            style={{ display: "block", textAlign: "center", marginTop: "0.5rem" }}>Download</a>
                                    </div>
                                ))}
                            </div>
                        </div>
                    )}

                    {(b.shotlist || []).length > 0 && (
                        <div className="card">
                            <h2>Storyboard</h2>
                            <div className="cp-shots">
                                {b.shotlist.map((s, i) => {
                                    const img = imgs[i];
                                    const src = img ? `/api/images/${sessionId}/${img.filename}` : null;
                                    return (
                                        <div key={i} className="cp-shot">
                                            {src && <img className="cp-shot-img" src={src} alt={s.scene}
                                                onClick={() => setLightbox(src)} />}
                                            <div className="cp-shot-body">
                                                <div className="cp-shot-head">
                                                    <span className="day-badge">Shot {i + 1}</span>
                                                    <span className="trend-preset">{presetLabel(s.preset)}</span>
                                                </div>
                                                <div className="style-name">{s.scene}</div>
                                                {s.on_screen_text && <div className="cp-ost">On-screen: &ldquo;{s.on_screen_text}&rdquo;</div>}
                                                <div className="style-desc">{s.image_prompt}</div>
                                            </div>
                                        </div>
                                    );
                                })}
                            </div>
                        </div>
                    )}

                    <div className="card">
                        <h2>Caption &amp; Hashtags</h2>
                        <p className="cp-caption">{b.caption}</p>
                        {tags.length > 0 && (
                            <div className="hashtag-row">
                                {tags.map((t, i) => <span key={i} className="hashtag">{t}</span>)}
                            </div>
                        )}
                        {b.cta && <p className="style-desc" style={{ marginTop: "0.9rem" }}><strong>CTA:</strong> {b.cta}</p>}
                    </div>

                    <div className="card cp-strategy">
                        <h2>Why This Wins</h2>
                        <ul className="why-list">
                            {(b.why_it_wins || []).map((w, i) => <li key={i}>{w}</li>)}
                        </ul>
                        <div className="cp-meta">
                            {b.best_post_time_myt && <div className="cp-meta-item"><span className="cp-meta-label">Best time (MYT)</span>{b.best_post_time_myt}</div>}
                            {b.audio_suggestion && <div className="cp-meta-item"><span className="cp-meta-label">Audio</span>{b.audio_suggestion}</div>}
                            {b.kpi_to_watch && <div className="cp-meta-item"><span className="cp-meta-label">KPI to watch</span>{b.kpi_to_watch}</div>}
                        </div>
                    </div>

                    {duration && (
                        <div className="card" style={{ textAlign: "center" }}>
                            <p style={{ color: "var(--brand-dark-grey)", fontSize: "0.85rem" }}>
                                Generated in {Math.floor(duration/60)}:{String(duration%60).padStart(2,'0')}
                            </p>
                        </div>
                    )}
                    <div style={{ textAlign: "center", marginTop: "1rem" }}>
                        <button className="btn-secondary" onClick={resetToInput}>Create Another</button>
                    </div>
                </>
                );
            })()}

            {view === "results" && activeMode !== "pdp" && activeMode !== "ideas" && activeMode !== "content_plus" && (
                <>
                    <div className="card" style={{ textAlign: "center" }}>
                        <h2 style={{ fontSize: "1.4rem", marginBottom: "0.5rem" }}>
                            {activeMode === "sku" ? "Product Content Pack Ready" : "Content Pack Ready"}
                        </h2>
                        <p style={{ color: "var(--brand-dark-grey)" }}>
                            {activeMode === "sku"
                                ? "Blog post, social media posts, product descriptions, and email campaign have been generated."
                                : "Your 30-day content engine has been generated."}
                        </p>

                        {productPreview && (
                            <div className="product-preview" style={{ justifyContent: "center", marginTop: "1rem" }}>
                                {productPreview.image_url && <img src={productPreview.image_url} alt={productPreview.title} />}
                                <div className="product-info" style={{ textAlign: "left" }}>
                                    <div className="product-name">{productPreview.title}</div>
                                    <div className="product-price">
                                        RM{productPreview.price}
                                        {productPreview.compare_price && <span className="compare">RM{productPreview.compare_price}</span>}
                                    </div>
                                </div>
                            </div>
                        )}

                        <div className="results-summary">
                            {activeMode === "sku" ? (
                                <>
                                    <div className="stat-card"><div className="value">5</div><div className="label">Excel Sheets</div></div>
                                    <div className="stat-card"><div className="value">6</div><div className="label">Social Posts</div></div>
                                    <div className="stat-card"><div className="value">{imagesDone}</div><div className="label">AI Images</div></div>
                                    <div className="stat-card"><div className="value">{videos.length}</div><div className="label">Videos</div></div>
                                    <div className="stat-card"><div className="value">1</div><div className="label">Email Campaign</div></div>
                                </>
                            ) : (
                                <>
                                    <div className="stat-card"><div className="value">6</div><div className="label">Excel Sheets</div></div>
                                    <div className="stat-card"><div className="value">30</div><div className="label">Days Planned</div></div>
                                    <div className="stat-card"><div className="value">{imagesDone}</div><div className="label">AI Images</div></div>
                                    <div className="stat-card"><div className="value">{videos.length}</div><div className="label">Videos</div></div>
                                    <div className="stat-card"><div className="value">4</div><div className="label">Blog Posts</div></div>
                                    <div className="stat-card"><div className="value">40</div><div className="label">FB Captions</div></div>
                                </>
                            )}
                            {duration && (
                                <div className="stat-card">
                                    <div className="value">{Math.floor(duration/60)}:{String(duration%60).padStart(2,'0')}</div>
                                    <div className="label">Total Time</div>
                                </div>
                            )}
                        </div>
                        <div className="download-section">
                            <button className="btn-download" onClick={() => window.location.href = `/api/download/${sessionId}`}>
                                Download Full Pack (.zip)
                            </button>
                            <button className="btn-download" style={{ background: "var(--brand-black)" }}
                                onClick={() => window.location.href = `/api/download-excel/${sessionId}`}>
                                Download Excel Only
                            </button>
                        </div>
                    </div>

                    {Object.keys(images).length > 0 && (
                        <div className="card">
                            <h2>Generated Images</h2>
                            <div className="image-grid">
                                {Object.entries(images)
                                    .filter(([_, img]) => img.status === "done" && img.filename)
                                    .sort(([a],[b]) => Number(a)-Number(b))
                                    .map(([day, img]) => (
                                        <div key={day} className="image-slot done" style={{ cursor: "pointer" }}
                                            onClick={() => setLightbox(`/api/images/${sessionId}/${img.filename}`)}>
                                            <img src={`/api/images/${sessionId}/${img.filename}`} alt={img.theme} />
                                            <div className="label">
                                                <span className="day-badge">{activeMode === "sku" ? `Image ${day}` : `Day ${day}`}</span>
                                                <br />{img.theme}
                                            </div>
                                        </div>
                                    ))}
                            </div>
                        </div>
                    )}

                    {videos.length > 0 && (
                        <div className="card">
                            <h2>Generated Videos</h2>
                            <p style={{ fontSize: "0.85rem", color: "#888", marginBottom: "1rem" }}>
                                Short product clips (6 sec, 9:16 vertical) for Reels, TikTok, and Stories
                            </p>
                            <div className="video-grid">
                                {videos.map((vid, i) => (
                                    <div key={i} className="video-slot">
                                        <video
                                            src={`/api/video/${sessionId}/${vid.filename}`}
                                            controls
                                            preload="metadata"
                                            playsInline
                                        />
                                        <div className="video-info">
                                            <span className="video-scene">{vid.scene.replace(/_/g, ' ')}</span>
                                            <span className="video-size">{vid.size_mb} MB</span>
                                        </div>
                                        <a
                                            href={`/api/video/${sessionId}/${vid.filename}`}
                                            download={vid.filename}
                                            className="btn-copy"
                                            style={{ display: "block", textAlign: "center", marginTop: "0.5rem" }}
                                        >Download</a>
                                    </div>
                                ))}
                            </div>
                        </div>
                    )}

                    <div style={{ textAlign: "center", marginTop: "1rem" }}>
                        <button className="btn-secondary" onClick={resetToInput}>Generate Another</button>
                    </div>
                </>
            )}

            {lightbox && (
                <div className="lightbox" onClick={() => setLightbox(null)}>
                    <img src={lightbox} alt="Preview" />
                </div>
            )}

            <div className="footer">
                MS. READ &copy; {new Date().getFullYear()} &mdash; Powered by BettieAI &mdash; <a href="https://www.msreadshop.com" target="_blank">msreadshop.com</a>
            </div>
        </div>
    );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
